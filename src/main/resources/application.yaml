spring:
  application:
    name: AutoWashPro_BE
  config:
    import: optional:classpath:application-local.yaml
  datasource:
    url: jdbc:postgresql://localhost:5432/novawash
    username: postgres
    password: 123
  sql:
    init:
      mode: always
      schema-locations: classpath:db/patch-email-auth.sql
      continue-on-error: true
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  docker:
    compose:
      enabled: false
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${GMAIL_USERNAME:duongtuankhoan123@gmail.com}
    password: ${GMAIL_APP_PASSWORD:aaypebmnqbcpjrob}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
        connectiontimeout: 10000
        timeout: 10000
        writetimeout: 10000

server:
  port: 8080

app:
  jwt:
    secret: AutoWashProSecretKeyForJWT2026MustBeAtLeast256BitsLong!!
    expiration-ms: 86400000
  otp:
    ttl-seconds: 120
  frontend:
    url: http://localhost:5173
  # mail.mode: GMAIL hoặc MOCK — đặt trong application-local.yaml (giống auth-test-sandbox)
  mail:
    mode: GMAIL
  security-token:
    email-verification-minutes: 30
    password-reset-minutes: 10
  gmail:
    username: ${GMAIL_USERNAME:duongtuankhoan123@gmail.com}
    app-password: ${GMAIL_APP_PASSWORD:aaypebmnqbcpjrob}
    from-name: NovaWash
  speedsms:
    enabled: false
    access-token: ${SPEEDSMS_ACCESS_TOKEN:}
    api-url: https://api.speedsms.vn/index.php/sms/send
    sms-type: 2
    sender: ${SPEEDSMS_SENDER:}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    doc-expansion: list
    display-operation-id: true
    filter: true
  api-docs:
    path: /v3/api-docs

logging:
  level:
    org.springframework.security: INFO
    org.springframework.mail: DEBUG
