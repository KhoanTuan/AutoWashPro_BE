spring:
  application:
    name: AutoWashPro_BE
  config:
    import: optional:classpath:application-local.yaml
  datasource:
    url: jdbc:postgresql://localhost:5432/novawash
    username: postgres
    password: 123
  sql:
    init:
      mode: always
      schema-locations: classpath:db/patch-email-auth.sql
      continue-on-error: true
  jpa:
    hibernate:
      ddl-auto: create
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  docker:
    compose:
      enabled: false
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${GMAIL_USERNAME:}
    password: ${GMAIL_APP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
        connectiontimeout: 10000
        timeout: 10000
        writetimeout: 10000

server:
  port: 8080

app:
  jwt:
    secret: AutoWashProSecretKeyForJWT2026MustBeAtLeast256BitsLong!!
    expiration-ms: 86400000
  otp:
    ttl-seconds: 120
  payment:
    momo:
      # MoMo Sandbox Credentials
      # Replace with your actual MoMo Sandbox credentials from https://dev.momo.vn
      partner-code: ${MOMO_PARTNER_CODE:MOMO12345}
      access-key: ${MOMO_ACCESS_KEY:F8635FE50A0FE6588}
      secret-key: ${MOMO_SECRET_KEY:NFcpIQIChnh0szvg6Z9zesZDZURAVESz}
      
      # MoMo Sandbox API Endpoint
      endpoint: ${MOMO_ENDPOINT:https://test-payment.momo.vn/v2/gateway/api/create}
      
      # Frontend success page URL (where customer is redirected after payment)
      redirect-url: ${MOMO_REDIRECT_URL:http://localhost:3000/payment-success}
      
      # Backend webhook URL for IPN callbacks (MoMo will POST to this)
      ipn-url: ${MOMO_IPN_URL:http://localhost:8080/api/v1/callback/momo/ipn}
      
      # MoMo payment request type (always "captureWallet" for standard payments)
      request-type: captureWallet
      
      # Language for MoMo UI ("vi" for Vietnamese, "en" for English)
      lang: vi
  frontend:
    url: http://localhost:5173
  # mail.mode: GMAIL hoặc MOCK — đặt trong application-local.yaml (giống auth-test-sandbox)
  mail:
    mode: MOCK
  security-token:
    email-verification-minutes: 30
    password-reset-minutes: 10
  gmail:
    username: ${GMAIL_USERNAME:}
    app-password: ${GMAIL_APP_PASSWORD:}
    from-name: NovaWash
  speedsms:
    enabled: false
    access-token: ${SPEEDSMS_ACCESS_TOKEN:}
    api-url: https://api.speedsms.vn/index.php/sms/send
    sms-type: 2
    sender: ${SPEEDSMS_SENDER:}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    doc-expansion: list
    display-operation-id: true
    filter: true
  api-docs:
    path: /v3/api-docs

logging:
  level:
    org.springframework.security: INFO
    org.springframework.mail: DEBUG
