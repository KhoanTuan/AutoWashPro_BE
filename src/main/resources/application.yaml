spring:
  application:
    name: AutoWashPro_BE
  datasource:
    url: jdbc:postgresql://localhost:5432/autowashpro
    username: postgres
    password: 123
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  docker:
    compose:
      enabled: false

server:
  port: 8080

app:
  jwt:
    secret: AutoWashProSecretKeyForJWT2026MustBeAtLeast256BitsLong!!
    expiration-ms: 86400000

logging:
  level:
    org.springframework.security: INFO
