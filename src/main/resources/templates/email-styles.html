<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">

<head>

    <style th:fragment="common-css">

        body { font-family: 'Segoe UI', system-ui, sans-serif; line-height: 1.6; color: #0f172a; margin: 0; padding: 0; background: #f1f5f9; }

        .container { max-width: 600px; margin: 20px auto; background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 16px rgba(15,23,42,.08); }

        .header { background: linear-gradient(135deg, #0284c7 0%, #0ea5e9 100%); color: #fff; padding: 28px 20px; text-align: center; }

        .header h1 { margin: 0; font-size: 22px; }

        .content { padding: 28px; }

        .greeting { font-size: 17px; font-weight: 600; color: #0369a1; margin-bottom: 16px; }

        p { color: #475569; margin-bottom: 14px; }

        .button { display: inline-block; background: #0ea5e9; color: #fff !important; font-weight: 700; padding: 14px 28px; text-decoration: none; border-radius: 8px; margin: 16px 0; }

        .link-box { background: #f8fafc; border: 1px solid #e2e8f0; padding: 12px; border-radius: 8px; word-break: break-all; font-size: 13px; }

        .info-box { background: #eff6ff; border-left: 4px solid #0ea5e9; padding: 14px; margin: 18px 0; border-radius: 4px; font-size: 14px; }

        .footer { background: #f8fafc; padding: 18px; text-align: center; font-size: 12px; color: #64748b; }

    </style>

</head>

<body></body>

</html>
